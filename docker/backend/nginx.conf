# nginx бэкенда: снаружи не виден, запросы к нему приходят только от nginx фронтенда

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # в чате можно отправить файл до 10 МБ
    client_max_body_size 12m;

    # картинки мест и туров открыты всем, файлы чата сюда не попадают
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # соединение чата живёт долго
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # ответ AI может идти долго
        proxy_read_timeout 120s;
    }
}
