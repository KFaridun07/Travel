# nginx фронтенда: принимает все запросы, сам отдаёт сайт, остальное передаёт бэкенду

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Cloudflare сообщает, что посетитель пришёл по HTTPS. Без него берём протокол этого соединения
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

upstream backend_nginx {
    server backend-nginx:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API, Swagger, админка, чат и картинки: всё это отвечает бэкенд
    location ~ ^/(api|ws|admin|media|swagger|redoc)(/|$) {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /static/ {
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # страницу браузер всегда проверяет заново, чтобы обновления сайта приходили сразу
    location = /index.html {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # сайт работает на одной странице: адреса после # браузер разбирает сам
    location / {
        try_files $uri /index.html;
    }
}
